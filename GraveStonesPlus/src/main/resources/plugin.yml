name: ${project.name}
version: "${project.version}"
main: com.bencodez.gravestonesplus.GraveStonesPlus
description: Description
author: BenCodez
api-version: 1.13
softdepend: [ProtocolLib, Vault, PvPManager, WorldGuard, WorldGuardExtraFlags, Slimefun, NBTAPI]
folia-supported: true
commands:
  gravestonesplus:
    description: Main plugin command
permissions:
  GraveStonesPlus.BreakOtherGraves:
    description: Allows you to break other graves
  GraveStonesPlus.AllowGrave:
    description: Permission to have graves
    default: true
  GraveStonesPlus.Trust:
    description: Grant bounded per-grave helper access
    default: false
  GraveStonesPlus.Trust.Revoke:
    description: Revoke bounded per-grave helper access
    default: false
  GraveStonesPlus.Track:
    description: Track an authorized grave
    default: true
  GraveStonesPlus.InspectItem:
    description: Inspect held item rule context
    default: false
